name: CI

on:
  push:
    branches: [ main, master, prod-hardening ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Verify Invariant Tests
        run: mvn clean verify --batch-mode

      - name: Run Microbenchmark
        run: java -jar target/raft-consensus-engine.jar --bench 1000
