name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Invariant Tests
        run: mvn clean test --batch-mode

      - name: Package Shaded JAR
        run: mvn package -DskipTests --batch-mode

      - name: Run Microbenchmark
        run: java -jar target/raft-consensus-engine.jar --bench 1000
